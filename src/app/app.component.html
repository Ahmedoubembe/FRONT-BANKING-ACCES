<!-- Shared Top Bar -->
<div class="top-bar" *ngIf="!isLoginPage">

  <!-- Logo / Identité gauche -->
  <div class="top-bar-left">
    <img src="assets/bamis-logo.png" alt="Bamis" class="bank-logo-img">
  </div>

  <!-- Titre centré -->
  <div class="top-bar-center">
    <span class="app-title">ACCES MOBILE-WEB BANKING</span>
  </div>

  <!-- Profil + Déconnexion droite -->
  <div class="top-bar-right">
    <span class="user-greeting">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" class="user-icon">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      {{ authService.getUserInfo()?.username || 'Utilisateur' }}
    </span>
    <button class="logout-btn" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Déconnexion
    </button>
  </div>

</div>

<router-outlet></router-outlet>
